<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg">
<title>Kaip — вход</title>
<style>
  :root { --bg:#14161c; --card:#1d2029; --text:#e8eaf0; --muted:#8b91a1; --accent:#5b8cff; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font:16px/1.4 system-ui, -apple-system, Roboto, sans-serif; padding:16px; }
  form { width:100%; max-width:360px; background:var(--card); border-radius:18px; padding:28px 22px; }
  img { width:64px; height:64px; display:block; margin:0 auto 12px; }
  h1 { margin:0 0 4px; text-align:center; font-size:22px; }
  p { margin:0 0 22px; text-align:center; color:var(--muted); font-size:14px; }
  input { width:100%; padding:14px; border-radius:12px; border:1px solid #2c3140; background:#12141a; color:var(--text); font-size:16px; }
  button { width:100%; margin-top:14px; padding:14px; border:0; border-radius:12px; background:var(--accent); color:#fff; font-size:16px; font-weight:600; }
  button:disabled { opacity:.6; }
  .err { color:var(--err); min-height:20px; margin-top:12px; text-align:center; font-size:14px; }
</style>
</head>
<body>
<form id="f">
  <img src="/static/icon.svg" alt="">
  <h1>Kaip</h1>
  <p>Десктопные программы на телефоне</p>
  <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" autofocus required>
  <button id="b">Войти</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('err');
  b.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: document.getElementById('pw').value }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) { location.href = '/'; return; }
    err.textContent = j.error || ('Ошибка ' + r.status);
  } catch (x) { err.textContent = 'Нет связи с сервером'; }
  b.disabled = false;
});
</script>
</body>
</html>
