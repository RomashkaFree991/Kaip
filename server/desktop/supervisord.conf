[supervisord]
nodaemon=true
user=root
logfile=/data/logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=1
pidfile=/run/supervisord.pid

[program:xvnc]
command=/usr/bin/Xvnc :1 -geometry %(ENV_KAIP_GEOMETRY)s -depth 24 -rfbport 5901 -localhost -SecurityTypes None -AlwaysShared -desktop Kaip
user=user
environment=HOME="/home/user",USER="user"
priority=10
autorestart=true
stdout_logfile=/data/logs/xvnc.log
stdout_logfile_maxbytes=2MB
redirect_stderr=true

[program:websockify]
command=/usr/bin/websockify --web /usr/share/novnc 0.0.0.0:6080 127.0.0.1:5901
user=user
priority=20
autorestart=true
stdout_logfile=/data/logs/websockify.log
stdout_logfile_maxbytes=2MB
redirect_stderr=true

[program:openbox]
command=/bin/bash -c 'until xset -display :1 q >/dev/null 2>&1; do sleep 0.5; done; xrdb -merge ~/.Xresources 2>/dev/null; xsetroot -solid "#20232b"; exec openbox'
user=user
environment=DISPLAY=":1",HOME="/home/user",USER="user",XDG_RUNTIME_DIR="/tmp/runtime-user"
priority=30
autorestart=true
stdout_logfile=/data/logs/openbox.log
stdout_logfile_maxbytes=2MB
redirect_stderr=true

[program:tint2]
command=/bin/bash -c 'until xset -display :1 q >/dev/null 2>&1; do sleep 0.5; done; exec tint2'
user=user
environment=DISPLAY=":1",HOME="/home/user",USER="user",XDG_RUNTIME_DIR="/tmp/runtime-user"
priority=40
autorestart=true
stdout_logfile=/data/logs/tint2.log
stdout_logfile_maxbytes=2MB
redirect_stderr=true

[program:launcher]
command=/usr/bin/python3 /opt/kaip/app.py
directory=/opt/kaip
user=root
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
