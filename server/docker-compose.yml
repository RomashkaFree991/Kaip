services:
  desktop:
    build: ./desktop
    image: kaip-desktop
    restart: unless-stopped
    env_file: .env
    shm_size: 512mb
    volumes:
      - ./data/home:/home/user   # Wine, настройки программ, AppImage
      - ./data/kaip:/data        # список программ, deb-пакеты, общая папка с телефоном
    expose: ["8000", "6080"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "${KAIP_HTTP_PORT:-80}:80"
      - "${KAIP_HTTPS_PORT:-443}:${KAIP_HTTPS_PORT:-443}"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [desktop]

volumes:
  caddy_data:
  caddy_config:
