plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.kaip.app'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.kaip.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        // Постоянный ключ из репозитория, чтобы новые версии ставились поверх старых.
        shared {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
