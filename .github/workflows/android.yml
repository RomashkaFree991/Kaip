name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kaip.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kaip-apk
          path: Kaip.apk

      - name: Publish to release "android-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Kaip для Android (последняя сборка)
          body: |
            Скачай **Kaip.apk** на телефон и установи (разреши установку из этого источника).
            Сборка из коммита ${{ github.sha }}.
          prerelease: false
          make_latest: true
          files: Kaip.apk
